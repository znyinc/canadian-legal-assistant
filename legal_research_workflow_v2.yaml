  # ============================================================================
  # SELF-REPRESENTATION ASSESSMENT
  # ============================================================================
  what_self_representation_actually_means:
    the_hard_truth: |
      Self-representation is choosing to:
      - Accept full responsibility for procedural mistakes
      - Compete against opponent's lawyer (if they have one) with no legal training
      - Make strategic decisions that a lawyer would advise on
      - Risk losing not because facts/law are against you, but because you missed a deadline
      - Spend hundreds of hours learning court procedure on the fly
      - Live with the stress and uncertainty of being your own counsel
      - Bear the financial risk of cost awards if you lose

      It is NOT a cost-saving measure if you lose the case.

    when_self_representation_might_work:
      - Small claims court (simplified procedure, dollar limit)
      - Uncontested divorce or family matters (legal aid available)
      - Straightforward landlord/tenant disputes
      - Clear contract disputes with simple facts
      - Opponent also self-representing (level playing field)
      - You have significant legal knowledge or experience
      - Modest financial stakes (under $10-25k)
      - Strong facts heavily in your favor
      - Opponent likely to settle (case doesn't go to trial)
      - No expert evidence required
      - Single jurisdiction, single issue

    when_self_representation_will_likely_fail:
      - Any criminal matter
      - Opponent has a lawyer and you don't
      - Complex legal issues requiring case law research
      - High stakes (six figures+, custody, business collapse)
      - Tight limitation periods / urgent deadlines
      - Procedurally complex court (Federal Court, Superior Court complex cases)
      - You have emotional involvement (bias affecting judgment)
      - Multiple parties or disputed facts
      - Expert evidence is central
      - Cross-border or multi-jurisdictional elements
      - Regulatory or administrative proceedings

  my_role_as_your_self_rep_support:
    what_i_provide: |
      - Research & analysis (you understand the issues)
      - Organization & roadmapping (you know what's coming)
      - Document drafting (you review and take responsibility)
      - Evidence organization (you present clearly)
      - Procedural compliance (you stay on track)
      - Discovery preparation (you survive examination)
      - Settlement economics (you make informed decisions)
      - Preparation (you enter trial ready)
      - Post-judgment options (you understand what's possible)
      - Ongoing risk assessment (you know when to escalate)

    what_you_must_provide: |
      - Full factual disclosure (I can only work with what you tell me)
      - Honest assessment of your case (will you win? be realistic)
      - Time commitment (this takes hundreds of hours)
      - Final decision authority (you decide what to do; I advise)
      - Legal responsibility (you're signing the documents)
      - Court compliance (you follow the rules; I can't force you to)
      - Emotional self-regulation (don't let anger drive decisions)
      - Financial transparency (can you afford to lose?)

    decision_point: |
      Before we proceed, you must decide:
      Am I doing this because:
      A) I genuinely cannot afford a lawyer, and the stakes are low?
      B) I want to learn and be involved, with a lawyer as backup?
      C) I'm confident I can win without a lawyer?
      D) I'm avoiding a lawyer for other reasons (ideology, distrust)?

      Each answer points to a different approach. Be honest.

  # ============================================================================
  # APPENDIX A — Glossary of Court Terminology
  # ============================================================================
  appendix_a_glossary:
    name: "Glossary of Court Terminology for Self-Represented Litigants"
    terms:
      adjournment: "Postponement of a hearing or trial to a later date"
      affiant: "Person who swears an affidavit"
      affidavit: "Written statement of facts sworn under oath"
      amicus_curiae: "Friend of the court — neutral party providing legal perspective"
      appearance: "Formal notice that you are participating in the proceeding"
      book_of_authorities: "Bound collection of case law and statutes you'll cite"
      case_management: "Court supervision of complex cases to control timelines"
      certiorari: "Order quashing a decision of a lower tribunal"
      costs: "Legal fees and expenses a losing party may be ordered to pay"
      cross_examination: "Questioning of a witness by the opposing party"
      default_judgment: "Judgment entered when a party fails to respond or appear"
      defendant: "Party being sued (in civil proceedings)"
      deponent: "Person who gives evidence by affidavit"
      disbursements: "Out-of-pocket expenses (filing fees, copying, experts)"
      discovery: "Pre-trial process of exchanging evidence and information"
      endorsement: "Judge's brief written order or direction, often on a motion"
      ex_parte: "Proceeding where only one side is present (without notice to other side)"
      exhibit: "Document or item entered into evidence"
      factum: "Written legal argument filed with the court"
      garnishment: "Court order to seize money owed to the judgment debtor"
      hearsay: "Out-of-court statement offered to prove the truth of its contents"
      interlocutory: "Interim or temporary — not a final decision"
      interrogatories: "Written questions that must be answered under oath"
      joinder: "Adding parties to a proceeding"
      leave: "Permission from the court (e.g., leave to appeal)"
      lien: "Legal claim on property as security for a debt"
      limitation_period: "Deadline for filing a claim (usually 2 years in Ontario)"
      mandamus: "Court order compelling a person or body to perform a duty"
      motion: "Application to the court for an interim order"
      motion_record: "Bundle of documents filed in support of a motion"
      notice_of_motion: "Formal document initiating a motion"
      originating_process: "The first document that starts a court proceeding"
      peremptory: "Final, not subject to further adjournment — you MUST attend"
      plaintiff: "Party bringing the lawsuit"
      pleadings: "Formal documents setting out each party's case (claim, defense, reply)"
      prejudice: "Harm or disadvantage to a party's legal position"
      pro_se: "Self-represented (literally: for oneself)"
      relief: "What you're asking the court to order (damages, injunction, declaration)"
      respondent: "Party responding to an appeal or application"
      sine_die: "Adjourned indefinitely (without a fixed return date)"
      statement_of_claim: "Document that starts a lawsuit (sets out your case)"
      statement_of_defense: "Defendant's response to the statement of claim"
      stay: "Order suspending enforcement of a judgment or proceeding"
      striking: "Removing a pleading or part of a pleading (Rule 25.11)"
      submission: "Oral or written argument to the court (not evidence)"
      subpoena: "Court order requiring a person to attend and testify (or produce documents)"
      summary_judgment: "Judgment without trial (Rule 20) — no genuine issue for trial"
      surety: "Person who guarantees another's obligation"
      undertaking: "Promise made during examination to provide information or documents"
      venue: "Geographic location where the case is heard"
      viva_voce: "Live oral testimony (as opposed to affidavit evidence)"
      voir_dire: "Trial within a trial — to determine admissibility of evidence"
      without_prejudice: "Communications made in settlement negotiations (not admissible)"

