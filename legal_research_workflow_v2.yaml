  # ============================================================================
  # HOW TO USE THIS WORKFLOW
  # ============================================================================
  how_to_use:
    instructions: |
      If you're going to self-represent:

      1. Start with the Critical Disclaimer — If any red flags apply, hire a lawyer first.
      2. Review Decision Gates — Understand where you'll reassess go/no-go.
      3. Phase 7 — Learn the exact court rules for your jurisdiction.
         → GATE 1: Right court? ADR first? Limitation intact?
      4. Phase 8 — Organize your evidence so it's clear and persuasive.
         → GATE 2: Do you have enough evidence to prove your case?
      5. Phase 8.5 — Navigate discovery (most dangerous stage for self-reps).
         → GATE 3: What did discovery reveal? Settle or continue?
      6. Phase 8.7 — Plan expert evidence (if needed).
      7. Phase 9 — I draft documents; you review, understand, and file them.
      8. Phase 9.5 — Make or respond to offers to settle. Attend mandatory mediation.
      9. Phase 10 — Practice testifying and develop cross-exam strategy.
      10. Phase 10.5 — Prepare for pre-trial conference (last chance to settle).
          → GATE 4: What did the pre-trial judge signal? Settle or continue?
      11. Phase 11 — Organize everything for trial day.
      12. Phase 12 — Understand your appeal options if you lose.
          → GATE 5: Appeal or accept? Cost-benefit analysis.
      13. Phase 12.5 — Handle costs submissions.
      14. Phase 13 — Stay on top of deadlines, costs, compliance, and your own wellbeing.

      The reality: Self-representation is the extreme scenario. Most people would be
      better served by hiring a lawyer — even for a limited scope (unbundled services).
      But if you're going solo, this workflow maximizes your chances by turning me into
      your research, organization, and document-preparation assistant.

    start_prompt: |
      Want to start? Tell me:
      (1) What court?
      (2) What's the dispute?
      (3) Have you already filed anything?
      (4) Does the opponent have a lawyer?
      (5) What is the approximate dollar value at stake?

      I'll begin with limitation period analysis, then Phase 7 (rules of court),
      and build from there.
