  # ============================================================================
  # APPENDIX C — Jurisdiction-Specific Variants
  # ============================================================================
  appendix_c_jurisdiction_variants:
    name: "Jurisdiction-Specific Rule Variations"
    note: |
      This workflow assumes Ontario Superior Court of Justice as the default
      jurisdiction. Rules vary significantly across courts and provinces.
      The following flags key differences.

    variants:
      ontario_small_claims:
        monetary_limit: "$35,000"
        rules: "Small Claims Court Rules (O. Reg. 258/98)"
        key_differences:
          - "No formal discovery (limited to request to inspect documents)"
          - "No examination for discovery"
          - "Relaxed evidence rules (hearsay may be admitted with appropriate weight)"
          - "Mandatory settlement conference (replaces pre-trial)"
          - "Simplified motion procedure"
          - "Deputy judges (lawyers, not full-time judges)"
          - "Built-in mediation at settlement conference"

      ontario_simplified_procedure:
        monetary_limit: "$200,000"
        rules: "Rule 76 (Ontario Rules of Civil Procedure)"
        key_differences:
          - "Limited oral discovery (2 hours per party)"
          - "No cross-examination on affidavits without leave"
          - "Mandatory mediation in designated counties"
          - "Summary trial option (Rule 76.12)"
          - "Shorter timelines for some steps"

      federal_court:
        rules: "Federal Courts Rules (SOR/98-106)"
        key_differences:
          - "Different form numbers and filing requirements"
          - "Electronic filing (mandatory in many cases)"
          - "Case management by prothonotary (not judge)"
          - "Different cost rules and tariff"
          - "Bilingual proceedings available"
          - "Subject matter limited to federal statutes"

      british_columbia:
        rules: "Supreme Court Civil Rules (B.C. Reg. 168/2009)"
        key_differences:
          - "Notice of Civil Claim (not Statement of Claim)"
          - "Different discovery rules and timelines"
          - "Civil Resolution Tribunal for claims under $5,000"
          - "Mandatory judicial case conference"

      alberta:
        rules: "Alberta Rules of Court (AR 124/2010)"
        key_differences:
          - "Litigation plan required for complex cases"
          - "Dispute resolution officer process"
          - "Different cost rules (Schedule C)"

      quebec:
        rules: "Code of Civil Procedure (CQLR, c. C-25.01)"
        key_differences:
          - "Civil law system (different from common law)"
          - "Pre-trial protocol mandatory"
          - "Different evidence rules"
          - "French-language proceedings (default)"

